spring.application.name=Banking_CRUD_API

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_crud_db
spring.datasource.username=postgres
spring.datasource.password=postgres123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/BankingRealm

# Server
server.port=8080